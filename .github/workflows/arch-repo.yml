name: Publish Arch repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published NetSanctum Desktop release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

concurrency:
  group: arch-repository
  cancel-in-progress: false

jobs:
  publish:
    name: Package Debian release for Arch Linux
    runs-on: ubuntu-22.04
    container: archlinux:base-devel@sha256:ee205c220399524a683cf495d411691b921baed8ab47cdc6d732efa782fae484
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: pacman -Syu --noconfirm github-cli
      - name: Build Arch package and repository database
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern "NetSanctum-Desktop_${version}_linux_amd64_deb.deb" \
            --dir dist
          package="$(scripts/package-arch.sh \
            "$version" \
            "dist/NetSanctum-Desktop_${version}_linux_amd64_deb.deb" \
            dist)"
          repo-add dist/netsanctum.db.tar.gz "$package"
          rm dist/netsanctum.db dist/netsanctum.files
          cp -L dist/netsanctum.db.tar.gz dist/netsanctum.db
          cp -L dist/netsanctum.files.tar.gz dist/netsanctum.files
          rm "dist/NetSanctum-Desktop_${version}_linux_amd64_deb.deb"
      - name: Publish package and repository database
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view arch-repo >/dev/null 2>&1; then
            gh release create arch-repo \
              --title "NetSanctum Desktop Arch repository" \
              --notes "Unsigned pacman repository generated from official NetSanctum Desktop Debian releases." \
              --latest=false
          fi
          gh release upload arch-repo \
            dist/netsanctum.db \
            dist/netsanctum.db.tar.gz \
            dist/netsanctum.files \
            dist/netsanctum.files.tar.gz \
            dist/*.pkg.tar.zst \
            --clobber
