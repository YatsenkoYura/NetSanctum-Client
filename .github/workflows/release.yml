name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  RUST_VERSION: "1.88.0"

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/version.mjs check "${GITHUB_REF_NAME}"
      - run: npm run check

  create-release:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --method POST \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f name="NetSanctum Desktop ${GITHUB_REF_NAME}" \
            -f body='Native desktop and offline client for NetSanctum. Desktop builds are not code-signed; Windows and macOS may display a publisher warning.' \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            args: --bundles deb,rpm
            appimage: true
          - name: Windows x86_64
            runner: windows-2025
            args: --bundles nsis,msi
          - name: macOS Apple Silicon
            runner: macos-15
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            runner: macos-15
            args: --target x86_64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            xdg-utils
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: NetSanctum-Desktop_[version]_[platform]_[arch]_[bundle][ext]
          args: ${{ matrix.args }} -- --locked
      - name: Build compatible AppImage
        if: matrix.appimage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          npm run tauri build -- --bundles appimage -- --locked
          appimage="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          rm -f \
            squashfs-root/usr/lib/libwayland-client.so.0 \
            squashfs-root/usr/lib/libwayland-cursor.so.0 \
            squashfs-root/usr/lib/libwayland-egl.so.1 \
            squashfs-root/usr/lib/libwayland-server.so.0
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "${APPIMAGETOOL_SHA256}  appimagetool.AppImage" | sha256sum --check --strict
          chmod +x appimagetool.AppImage
          version="$(node -p "require('./package.json').version")"
          output="NetSanctum-Desktop_${version}_linux_amd64_appimage.AppImage"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool.AppImage squashfs-root "$output"
          gh release upload "${GITHUB_REF_NAME}" "$output" --clobber

  android:
    name: Build Android ARM64
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: android-arm64
      - run: npm ci
      - run: npm run tauri -- android init
      - run: npm run tauri -- android build --apk --target aarch64 -- --locked
      - name: Sign and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netsanctum-release.jks"
          shopt -s nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          test "${#apks[@]}" -eq 1
          version="${GITHUB_REF_NAME#v}"
          aligned="$RUNNER_TEMP/NetSanctum_${version}_android_arm64_aligned.apk"
          output="$RUNNER_TEMP/NetSanctum_${version}_android_arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "${apks[0]}" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/netsanctum-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$output" \
            "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$output"
          gh release upload "$GITHUB_REF_NAME" "$output"

  publish:
    name: Publish release
    needs: [build, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

  publish-arch:
    name: Update Arch repository
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Start Arch repository workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run arch-repo.yml --ref "${GITHUB_REF_NAME}" -f tag="${GITHUB_REF_NAME}"
